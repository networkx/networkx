name: Milestone

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  milestone_pr:
    name: attach to PR
    if: github.repository == 'networkx/networkx'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: scientific-python/attach-next-milestone-action@796cfa44ba1e1a9a4bce7896241d4612a3f06327 # v0.2.0
        with:
          token: ${{ github.token }}
