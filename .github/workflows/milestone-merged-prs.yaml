name: Milestone

on:
  pull_request_target:
    types:
      - closed
    branches:
      - "main"

permissions:
  contents: read

jobs:
  milestone_pr:
    name: attach to PR
    runs-on: ubuntu-latest
    steps:
      - uses: scientific-python/attach-next-milestone-action@796cfa44ba1e1a9a4bce7896241d4612a3f06327 # v0.2.0
        with:
          token: ${{ secrets.MILESTONE_LABELER_TOKEN }}
          force: true
