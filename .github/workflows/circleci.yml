name: circleci

permissions: read-all

on: [status]
jobs:
  image:
    runs-on: ubuntu-latest
    name: Run CircleCI image artifact redirector
    permissions:
      statuses: write
    steps:
      - name: GitHub Action step
        uses: scientific-python/circleci-artifacts-redirector-action@d35a82a1e5de3864f4cf9649eb7cedcedcfe8e09 # v1.3.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-token: ${{ secrets.CIRCLECI_ARTIFACT_REDIRECTOR_TOKEN }}
          artifact-path: 0/results/fig_comparison.html
          circleci-jobs: image

  documentation:
    runs-on: ubuntu-latest
    name: Run CircleCI documentation artifact redirector
    permissions:
      statuses: write
    steps:
      - name: GitHub Action step
        uses: scientific-python/circleci-artifacts-redirector-action@d35a82a1e5de3864f4cf9649eb7cedcedcfe8e09 # v1.3.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-token: ${{ secrets.CIRCLECI_ARTIFACT_REDIRECTOR_TOKEN }}
          artifact-path: 0/doc/build/html/index.html
          circleci-jobs: documentation

  coverage:
    runs-on: ubuntu-latest
    name: Run CircleCI coverage artifact redirector
    permissions:
      statuses: write
    steps:
      - name: GitHub Action step
        uses: scientific-python/circleci-artifacts-redirector-action@d35a82a1e5de3864f4cf9649eb7cedcedcfe8e09 # v1.3.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          api-token: ${{ secrets.CIRCLECI_ARTIFACT_REDIRECTOR_TOKEN }}
          artifact-path: 0/coverage/index.html
          circleci-jobs: coverage
