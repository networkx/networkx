# See: https://circleci.com/docs/2.0/language-python/

version: 2.1

jobs:
  documentation:
    docker:
      - image: cimg/python:3.12
    resource_class: medium.gen2

    steps:
      - checkout

      - run:
          name: Update apt-get
          command: |
            sudo apt update

      - run:
          # Optional dependency for more efficient matplotlib animation
          name: Install ffmpeg
          command: sudo apt install -y ffmpeg

      - run:
          name: Install pysal dependencies
          command: sudo apt install -y libspatialindex-dev

      - restore_cache:
          keys:
            - pip-cache-v1

      - run:
          name: Install Python dependencies
          command: |
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip uv
            # Install trusted backends, but not their dependencies.
            # We only need to use the "networkx.backend_info" entry-point.
            # This is the nightly wheel for nx-cugraph.
            uv pip install nx-cugraph-cu11 --extra-index-url https://pypi.anaconda.org/rapidsai-wheels-nightly/simple --no-deps --pre
            # Development version of GraphBLAS backend
            uv pip install git+https://github.com/python-graphblas/graphblas-algorithms.git@main --no-deps
            # Development version of nx-parallel backend
            uv pip install git+https://github.com/networkx/nx-parallel.git@main --no-deps
            # Development version of nx-neptune backend0
            uv pip install git+https://github.com/awslabs/nx-neptune.git@main --no-deps
            pip list

      - save_cache:
          key: pip-cache-v1
          paths:
            - ~/.cache/pip

      - run:
          name: Install
          command: |
            source venv/bin/activate
            uv pip install -e '.[default,test,extra,example,doc]'
            uv pip install -e .
            uv pip list
            python -c "import osmnx; print(osmnx.__version__)" > /tmp/osmnx-version

      # plot_osmnx.py queries the Overpass API, which is sometimes unavailable.
      # osmnx caches responses (keyed by query) in examples/geospatial/cache,
      # so fetch them before the doc build with retries, and cache across runs.
      - restore_cache:
          keys:
            - osmnx-cache-v1-{{ checksum "examples/geospatial/plot_osmnx.py" }}-{{ checksum "/tmp/osmnx-version" }}

      - run:
          name: Pre-fetch OpenStreetMap data
          command: |
            source venv/bin/activate
            cd examples/geospatial
            # Fail (and skip save_cache) if every attempt fails
            for delay in 30 60 120 fail; do
              MPLBACKEND=agg python plot_osmnx.py && break
              [ "${delay}" = fail ] && exit 1
              echo "Retrying in ${delay} seconds..."
              sleep ${delay}
            done
            rm -f graph.gpkg graph.graphml

      - save_cache:
          key: osmnx-cache-v1-{{ checksum "examples/geospatial/plot_osmnx.py" }}-{{ checksum "/tmp/osmnx-version" }}
          paths:
            - examples/geospatial/cache

      - run:
          name: Build docs
          command: |
            # NOTE: bad interaction w/ blas multithreading on circleci
            export OMP_NUM_THREADS=1
            source venv/bin/activate
            make -C doc/ SPHINXOPTS="-j 2 -W --keep-going" html
          no_output_timeout: 30m

      - store_artifacts:
          path: doc/build/html

  image:
    docker:
      - image: cimg/python:3.12
    resource_class: medium.gen2

    steps:
      - checkout

      - run:
          name: Install Python dependencies
          command: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip uv
            pip install pytest-mpl  # NOTE: specified here to avoid confusing conda
            pip list

      - run:
          name: Install
          command: |
            source venv/bin/activate
            uv pip install -e .[default,test]
            uv pip list

      - run:
          name: Test NetworkX drawing
          command: |
            source venv/bin/activate
            pytest --mpl --mpl-generate-summary=html --mpl-results-path=results --pyargs networkx.drawing

      - store_artifacts:
          path: results

  coverage:
    docker:
      - image: cimg/python:3.12
    resource_class: medium.gen2
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip uv
            uv pip install .[default,extra,test]
            pip list
      - run:
          name: Run tests
          command: |
            source venv/bin/activate
            pytest --cov=networkx --cov-report=html -n 4 --doctest-modules --durations=20 --pyargs networkx
      - store_artifacts:
          path: htmlcov
          destination: coverage

workflows:
  documentation_and_image_comparison:
    jobs:
      - documentation
      - image
  test-and-report-coverage:
    jobs:
      - coverage
